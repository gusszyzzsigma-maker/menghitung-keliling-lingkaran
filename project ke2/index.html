<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menghitung Keliling Lingkaran</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            border: 6px solid #2196f3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: #2196f3;
            font-weight: bold;
        }

        h1 {
            color: #1565c0;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .formula {
            background: #e3f2fd;
            color: #1565c0;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2196f3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.12);
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-hitung {
            background: #2196f3;
            color: white;
        }

        .btn-hitung:hover {
            background: #1976d2;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(33, 150, 243, 0.3);
        }

        .btn-reset {
            background: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover {
            background: #bdbdbd;
            transform: translateY(-2px);
        }

        .hasil {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f5f5f5;
            color: #1565c0;
            font-weight: bold;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error {
            color: #d32f2f;
            background: #ffebee;
        }

        @media (max-width: 480px) {
            .card {
                padding: 22px;
            }

            h1 {
                font-size: 22px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Ikon matematika -->
        <div class="icon">π</div>

        <h1>Menghitung Keliling Lingkaran</h1>

        <p class="description">
            Masukkan nilai jari-jari untuk menghitung keliling lingkaran.
        </p>

        <!-- Rumus -->
        <div class="formula">
            Rumus: K = 2 × π × r
        </div>

        <!-- Input Jari-jari -->
        <div class="input-group">
            <label for="jariJari">Jari-jari (r)</label>
            <input
                type="number"
                id="jariJari"
                placeholder="Masukkan jari-jari"
                min="0"
                step="any"
            >
        </div>

        <!-- Tombol -->
        <div class="buttons">
            <button class="btn-hitung" onclick="hitungKeliling()">
                Hitung
            </button>

            <button class="btn-reset" onclick="resetForm()">
                Reset
            </button>
        </div>

        <!-- Area hasil -->
        <div class="hasil" id="hasil">
            Hasil akan tampil di sini
        </div>

    </div>

    <script>
        // Fungsi menghitung keliling lingkaran
        function hitungKeliling() {

            // Mengambil nilai jari-jari
            const jariJari = parseFloat(
                document.getElementById("jariJari").value
            );

            const hasil = document.getElementById("hasil");

            // Validasi input
            if (isNaN(jariJari) || jariJari <= 0) {
                hasil.textContent =
                    "Masukkan nilai Jari-jari yang valid.";

                hasil.classList.add("error");
                return;
            }

            // Rumus keliling lingkaran
            const keliling = 2 * Math.PI * jariJari;

            // Menampilkan hasil
            hasil.textContent =
                "Keliling Lingkaran = " + keliling.toFixed(2);

            hasil.classList.remove("error");
        }

        // Fungsi reset
        function resetForm() {

            // Menghapus input
            document.getElementById("jariJari").value = "";

            // Menghapus hasil
            const hasil = document.getElementById("hasil");

            hasil.textContent = "Hasil akan tampil di sini";
            hasil.classList.remove("error");

            // Mengembalikan fokus ke input
            document.getElementById("jariJari").focus();
        }
    </script>

</body>
</html>
